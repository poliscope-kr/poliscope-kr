name: 해외 보도 수집
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: world
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/world.mjs
      - name: 저장
        run: |
          git config user.name "poliscope-bot"
          git config user.email "poliscope-bot@users.noreply.github.com"
          git add docs/data/world.json
          git diff --cached --quiet || git commit -m "해외 보도 갱신 $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null; sleep 20; done
          exit 1
