name: 나라 예산 수집
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 수집
        env:
          OPENFISCAL_KEY: ${{ secrets.OPENFISCAL_KEY }}
        run: node scripts/budget.mjs
      - name: 저장
        run: |
          git config user.name "poliscope-bot"
          git config user.email "poliscope-bot@users.noreply.github.com"
          git add docs/data/budget.json
          git diff --cached --quiet || git commit -m "나라 예산 갱신 $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null; sleep 15; done
          exit 1
