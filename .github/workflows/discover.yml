name: API 목록 확인
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/discover.mjs
      - run: |
          git config user.name "poliscope-bot"
          git config user.email "poliscope-bot@users.noreply.github.com"
          git add data/api-catalog.json
          git diff --cached --quiet || git commit -m "API 목록 갱신"
          git pull --rebase origin main
          git push
