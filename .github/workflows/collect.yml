name: 국회 자료 수집
on:
  schedule:
    - cron: '17 21 * * *'   # 매일 한국시간 오전 6시 17분
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 수집
        id: collect
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: node scripts/collect.mjs
      - name: 유튜브 수집
        if: always()
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/youtube.mjs
      - name: 기사 수집
        if: always()
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/news.mjs
      - name: 저장
        if: always()
        run: |
          git config user.name "poliscope-bot"
          git config user.email "poliscope-bot@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet || git commit -m "자료 갱신 $(date -u +%F)"
          git pull --rebase origin main
          git push
      - name: 남은 표결 이어 받기
        if: steps.collect.outputs.incomplete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main
