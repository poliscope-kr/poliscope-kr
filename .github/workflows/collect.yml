name: 국회 자료 수집
on:
  schedule:
    - cron: '17 21 * * *'   # 매일 한국시간 오전 6시 17분
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 수집
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: node scripts/collect.mjs
      - name: 저장
        run: |
          git config user.name "poliscope-bot"
          git config user.email "poliscope-bot@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet || git commit -m "자료 갱신 $(date -u +%F)"
          git push
