name: 국회 자료 수집
on:
  schedule:
    - cron: '17 21 * * *'   # 매일 한국시간 오전 6시 17분
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 수집
        id: collect
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: node scripts/collect.mjs
      - name: 법안 상세 수집
        if: always()
        continue-on-error: true
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: node scripts/laws.mjs
      - name: 정부 제출 법안 수집
        if: always()
        continue-on-error: true
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: node scripts/gov.mjs
      - name: 연구단체 수집
        if: always()
        continue-on-error: true
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: node scripts/projects.mjs
      - name: 유튜브 수집
        if: always()
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/youtube.mjs
      - name: 기사 수집
        if: always()
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/news.mjs
      - name: 법안 보도량 수집
        if: always()
        continue-on-error: true
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/buzz.mjs
      - name: 해외 보도 수집
        if: always()
        continue-on-error: true
        run: node scripts/world.mjs
      - name: 추이 기록
        if: always()
        continue-on-error: true
        run: node scripts/trend.mjs
      - name: 예산정책처 보고서 수집
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: node scripts/nabo.mjs
      - name: 분야별 집행 수집
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          OPENFISCAL_KEY: ${{ secrets.OPENFISCAL_KEY }}
        run: node scripts/execution.mjs
      - name: 나라 예산 수집
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        env:
          OPENFISCAL_KEY: ${{ secrets.OPENFISCAL_KEY }}
        run: node scripts/budget.mjs
      - name: 열린재정 사업 수집
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        env:
          OPENFISCAL_KEY: ${{ secrets.OPENFISCAL_KEY }}
        run: node scripts/fiscal.mjs
      - name: 저장
        if: always()
        run: |
          git config user.name "poliscope-bot"
          git config user.email "poliscope-bot@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet || git commit -m "자료 갱신 $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; git rebase --abort 2>/dev/null; sleep 20; done
          exit 1
      - name: 남은 표결 이어 받기
        if: steps.collect.outputs.incomplete == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main
