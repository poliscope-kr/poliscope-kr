function rank(){
 const w={};METRICS.forEach(x=>w[x.k]=x.w0);const P=Object.fromEntries(METRICS.map(x=>[x.k,pctile(x.k)]));const ol=h('ol',{class:'rank'});
 function draw(){const tot=Object.values(w).reduce((a,b)=>a+b,0);ol.textContent='';if(!tot){ol.append(h('li',null,h('span'),'기준을 하나 이상 올려 주세요.'));return}
  const r=M.map(m=>{let s=0,u=0;METRICS.forEach(x=>{if(P[x.k][m.id]!=null&&w[x.k]){s+=P[x.k][m.id]*w[x.k];u+=w[x.k]}});return{m,s:u/tot>=.5?s/u:null}}).filter(x=>x.s!=null).sort((a,b)=>b.s-a.s);
  r.forEach((x,i)=>ol.append(h('li',null,h('span',{class:'tn muted'},i+1),h('a',{href:'#m/'+x.m.id},x.m.name,' ',h('span',{class:'small muted',style:'font-weight:400'},x.m.party+' · '+x.m.area)),h('span',{class:'tn'},x.s.toFixed(1)))))}
 show(h('h1',null,'내 기준 순위'),h('p',{class:'muted'},'기준의 비중을 정하면 순위가 다시 계산됩니다. 점수는 각 기준의 백분위를 비중대로 평균한 값이며, 일을 잘하는지에 대한 판정이 아닙니다. 고른 기준의 절반 이상에 자료가 있는 의원만 나옵니다.'),
  METRICS.map(x=>{const o=h('span',{class:'tn'},x.w0);return h('div',null,h('label',{class:'w'},h('span',null,x.label),h('input',{type:'range',min:0,max:3,value:x.w0,oninput:e=>{w[x.k]=+e.target.value;o.textContent=e.target.value;draw()}}),o),h('div',{class:'small muted'},x.desc))}),ol);draw()}

function quiz(){
 if(Q.length<3)return show(h('h1',null,'표결 궁합 테스트'),h('p',{class:'muted'},'찬반이 갈린 의안 자료가 아직 부족합니다.'));
 const items=Q.slice(0,10),ans={};let i=0;
 function step(){if(i>=items.length)return result();const b=items[i],u=safe(b.url);const a=v=>()=>{if(v)ans[b.id]=v;i++;step()};
  show(h('div',{class:'small muted'},`${i+1} / ${items.length}`),h('div',{class:'bar'},h('i',{style:`width:${i/items.length*100}%`})),h('div',{class:'q'},b.name),h('div',{class:'small muted'},(b.date||'')+' 본회의 표결 ',u?h('a',{href:u,target:'_blank',rel:'noopener'},'법안 내용 보기'):null),
   h('div',{class:'btns'},h('button',{class:'pri',onclick:a('y')},'찬성'),h('button',{class:'pri',onclick:a('n')},'반대')),h('div',{style:'margin-top:8px'},h('button',{onclick:a(null),style:'width:100%'},'잘 모르겠어요 (건너뛰기)')))}
 function result(){const ids=Object.keys(ans);if(ids.length<3){show(h('p',null,'세 문항 이상 답해야 결과를 볼 수 있습니다.'),h('button',{onclick:quiz},'다시 하기'));return}
  const rows=M.map(m=>{let same=0,c=0;items.forEach(b=>{if(!ans[b.id])return;const v=b.y.includes(m.id)?'y':b.n.includes(m.id)?'n':null;if(!v)return;c++;if(v===ans[b.id])same++});return{m,c,same,p:c?same/c*100:null}}).filter(x=>x.c>=Math.min(3,ids.length)).sort((a,b)=>b.p-a.p||b.c-a.c);
  const top=rows.slice(0,5),tx=top.length?`내 표결 궁합 1위는 ${top[0].m.name} 의원 (${top[0].p.toFixed(0)}%)`:'';const cp=h('button',{onclick:()=>{try{navigator.clipboard.writeText(tx+' '+location.href.split('#')[0]);cp.textContent='복사됨'}catch{}}},'결과 복사');
  show(h('h1',null,'나와 표결이 비슷한 의원'),h('p',{class:'muted'},ids.length+'개 법안만 비교한 결과입니다. 표결이 비슷하다는 뜻일 뿐, 투표를 권하는 내용이 아닙니다. 답한 내용은 저장하지 않습니다.'),top.map(x=>h('a',{class:'card',href:'#m/'+x.m.id},h('div',{class:'row'},h('span',{class:'name'},x.m.name),h('b',{class:'tn'},x.p.toFixed(0)+'%')),h('div',{class:'small muted'},x.m.party+' · '+x.m.area+' · '+x.c+'건 비교'))),h('div',{class:'btns'},cp,h('button',{onclick:quiz},'다시 하기')))}
 step()}

function about(){
 show(h('h1',null,'자료와 계산 방법'),h('p',null,'모든 수치는 열린국회정보 Open API의 공개 자료를 하루 한 번 받아 같은 규칙으로 계산합니다. 사람이나 AI가 의원을 판정하지 않습니다.'),METRICS.map(x=>h('div',{class:'card'},h('b',null,x.label),h('div',{class:'small muted'},x.desc))),
  h('h2',null,'표결 궁합 문항은 어떻게 고르나요'),h('p',null,'본회의 표결 가운데 찬성·반대를 합쳐 100명 이상 참여했고 소수 쪽이 15% 이상인 의안을 최근순으로 뽑습니다.'),
  h('h2',null,'한계'),h('p',null,'지역구 활동, 상임위 질의, 법안의 질은 이 수치에 담기지 않습니다. 오류를 발견하면 원문 기록으로 확인해 주세요.'),META&&META.warnings.length?h('div',{class:'note'},META.warnings.map(w=>h('div',null,w))):null,h('p',null,h('a',{href:'https://open.assembly.go.kr',target:'_blank',rel:'noopener'},'열린국회정보')),fix('[정정] '))}

const ROUTES=[['home','찾기'],['quiz','표결 궁합'],['rank','내 기준 순위'],['about','자료·방법']];
function go(){const r=(location.hash||'#home').slice(1);$('nav').replaceChildren(...ROUTES.map(([k,l])=>h('a',{href:'#'+k,class:r===k?'on':null},l)));
 if(r.startsWith('m/'))member(r.slice(2));else if(r==='quiz')quiz();else if(r==='rank')rank();else if(r==='about')about();else home();scrollTo(0,0)}
(async()=>{try{const g=u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()});[M,Q,META,NOTES]=await Promise.all([g('data/members.json'),g('data/quiz.json'),g('data/meta.json'),g('notes.json').catch(()=>({}))]);const YT=await g('data/youtube.json').catch(()=>({members:{}}));M.forEach(m=>{const y=YT.members[m.id];if(y){m.yt=y;m.online=y.online}});const NW=await g('data/news.json').catch(()=>({members:{}}));M.forEach(m=>{const n=NW.members[m.id];if(n){m.nw=n;m.news=n.news}});$('f').textContent='자료 기준: '+new Date(META.updated).toLocaleString('ko-KR')+' · 출처: 열린국회정보 · 의원·정당과 무관한 민간 정보 서비스';addEventListener('hashchange',go);go()}catch{show(h('h1',null,'자료를 준비하고 있습니다'),h('p',{class:'muted'},'첫 수집이 끝나면 의원 정보가 표시됩니다.'))}})();
})();
</script></body></html>
